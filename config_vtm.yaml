enhancement:
  implementation: dense  # Start with DenseNet, can change to res/conv
  metadata_size: 6
  metadata_features: 6
  
  with_mask: true
  input_shape: [132, 132, 3]
  
  # VTM-specific settings
  vtm_features:
    spatial_maps: ["qp", "depth"]  # Use QP and depth maps
    temporal_features: ["motion"]    # Use motion vectors
    structure_aware: true           # Enable structure-aware processing

trainer:
  mode: gan  # Can change to enhancer for enhancement-only training
  gan:
    epochs: 100
    enhancer_lr: 2e-5
    discriminator_lr: 1e-4
    betas: [0.5, 0.999]
    
    # VTM-aware loss weighting
    channels_grad_scales: [0.4, 0.3, 0.3]  # Y, U, V emphasis
    
  enhancer:  # For enhancement-only training
    epochs: 100
    lr: 2e-5
    betas: [0.5, 0.999]

  # Structure-aware training
  curriculum_learning:
    qp_progressive: true  # Start with easy frames, progress to hard
    complexity_aware: true  # Weight loss based on block complexity