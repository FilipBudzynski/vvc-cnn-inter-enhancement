dataset:
  orig_dir: "data"
  train_dir: "output/decoded"
  val_dir: "output/decoded"
  test_dir: "output/decoded"

dataloader:
  batch_size: 8
  val_batch_size: 4
  num_workers: 4

enhancer:
  implementation: "dense"  # Changed from "res" to "dense" - Piotr's best
  input_shape: [3, 132, 132]
  activation: "prelu"
  reflect_padding: true
  with_mask: true
  metadata_size: 8
  use_sota_metadata: true
  metadata_features: 16
  save_to: "experiments/enhancer/vtm_densenet_v1.pth"
  load_from: null
  features:
    features: 64
    kernel_size: 9  # Larger kernel for dense net
    stride: 1
    padding: 4
    pool: false
    dense: true
    res: false
  structure:
    blocks:
      - { num_layers: 4, features: 64, kernel_size: 7, padding: 3, stride: 1 }
      - { num_layers: 4, features: 96, kernel_size: 5, padding: 2, stride: 1 }
      - { num_layers: 4, features: 64, kernel_size: 3, padding: 1, stride: 1 }
      - { num_layers: 4, features: 48, kernel_size: 3, padding: 1, stride: 1 }
      - { num_layers: 4, features: 32, kernel_size: 3, padding: 1, stride: 1 }
  output_block:
    features: 3
    kernel_size: 3
    padding: 1
    stride: 1
    tanh: true

trainer:
  mode: "enhancer"
  enhancer:
    epochs: 1000
    enhancer_lr: 0.0001
    num_samples: 4
    enhancer_scheduler: True
    enhancer_scheduler_gamma: 0.1
    enhancer_scheduler_milestones: [100, 300, 500, 700, 900]
